[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:gutenberg]
user=gutenberg
directory=/app/gutenberg
command=/home/gutenberg/.local/bin/uv run uwsgi --ini /app/gutenberg/gutenberg.ini
autostart=true
autorestart=true
redirect_stderr=true
environment=PATH="/home/gutenberg/.local/bin:%(ENV_PATH)s",HOME=/home/gutenberg,USER=gutenberg
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gutenberg_worker]
user=gutenberg
directory=/app/gutenberg
command=/home/gutenberg/.local/bin/uv run celery -A gutenberg worker -l INFO
autostart=true
autorestart=true
redirect_stderr=true
environment=PATH="/home/gutenberg/.local/bin:%(ENV_PATH)s",HOME=/home/gutenberg,USER=gutenberg
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:soffice]
user=gutenberg
command= /usr/lib/libreoffice/program/soffice.bin --headless --nodefault --norestore --accept='socket,host=127.0.0.1,port=2002,tcpNoDelay=1;urp;StarOffice.ComponentContext'
autostart=true
autorestart=true
redirect_stderr=true
environment=USER=gutenberg,HOME=/home/gutenberg
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0

[program:cupsd]
command=/bin/bash -c "/usr/sbin/cupsd -l"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs = 0
autorestart=true
priority=2
